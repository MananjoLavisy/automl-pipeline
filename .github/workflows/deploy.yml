on:
  push:
    branches: [main, master]

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code       # pour récupérer/comparer le code source du dépôt
      uses: actions/checkout@v3

    - name: Set up Docker Buildx        # lancer image docker manuellement
      uses: docker/setup-buildx-action@v2
      
    - name: Login to dockerhub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: build and push docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/automl-pipeline:latest
          ${{ secrets.DOCKER_USERNAME }}/automl-pipeline:${{ github.sha }}
